name: AI Stockbroker

# The bot's "brain". Runs on a schedule during US market hours, and can also
# be triggered by hand from the Actions tab for an on-demand test run.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Research only - build a plan but place NO orders"
        type: boolean
        default: false
      force:
        description: "Place orders even if the market is closed"
        type: boolean
        default: false
  schedule:
    # GitHub cron is UTC. 13:00-21:00 UTC on weekdays covers the 09:30-16:00 ET
    # session in both EDT and EST, so no seasonal edit is needed.
    #
    # NOTE: GitHub's scheduler is BEST-EFFORT. Scheduled runs are frequently
    # delayed by an hour or more and are silently DROPPED entirely under load -
    # observed here as whole trading days with zero runs. Asking for a tick
    # every 15 minutes does not mean 15-minute trading; it means that when most
    # ticks are dropped, some still land. The cheap triage gate keeps the cost
    # of extra ticks near zero (~$0.002 for a quiet cycle).
    #
    # If you need genuinely reliable timing, run `python -m bot.run` from a real
    # scheduler on an always-on host - see the README.
    - cron: "*/15 13-21 * * 1-5"

# Never let two cycles run at once (they'd both try to trade + commit).
concurrency:
  group: ai-stockbroker
  cancel-in-progress: false

permissions:
  contents: write  # needed to commit the dashboard data back to the repo

jobs:
  trade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run one trading cycle
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          # Variables (repo Settings -> Secrets and variables -> Actions -> Variables).
          # These are optional; the defaults in bot/config.py apply if unset.
          TRADING_MODE: ${{ vars.TRADING_MODE || 'paper' }}
          LIVE_REQUIRE_APPROVAL: ${{ vars.LIVE_REQUIRE_APPROVAL || 'true' }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL || 'claude-sonnet-5' }}
          ENABLE_WEB_SEARCH: ${{ vars.ENABLE_WEB_SEARCH || 'true' }}
          # Second, independent AI that audits trades before they run (anti-black-box).
          ENABLE_AUDITOR: ${{ vars.ENABLE_AUDITOR || 'true' }}
          # Capital cap: bot behaves as if it holds only this much (default 1000).
          CAPITAL_CAP: ${{ vars.CAPITAL_CAP || '1000' }}
          CAPITAL_CURRENCY: ${{ vars.CAPITAL_CURRENCY || 'CHF' }}
          WATCHLIST: ${{ vars.WATCHLIST }}
          # Risk preset: low | medium | semi-high | high. Defaults to high.
          RISK_LEVEL: ${{ vars.RISK_LEVEL || 'high' }}
          # Roughly how many positions the book should hold (drives sizing).
          TARGET_POSITIONS: ${{ vars.TARGET_POSITIONS }}
          # Cheap triage gate that skips quiet cycles to save cost (true/false).
          TRIAGE_ENABLED: ${{ vars.TRIAGE_ENABLED || 'true' }}
          # Cached daily fundamentals value scan; AI-reviewed stop-loss.
          ENABLE_FUNDAMENTALS: ${{ vars.ENABLE_FUNDAMENTALS || 'true' }}
          STOP_LOSS_REVIEW_PCT: ${{ vars.STOP_LOSS_REVIEW_PCT || '8' }}
          STOP_LOSS_HARD_PCT: ${{ vars.STOP_LOSS_HARD_PCT || '0' }}
          MAX_ORDERS_PER_RUN: ${{ vars.MAX_ORDERS_PER_RUN }}
          MAX_NOTIONAL_PER_ORDER: ${{ vars.MAX_NOTIONAL_PER_ORDER }}
          MAX_ALLOCATION_PCT_PER_SYMBOL: ${{ vars.MAX_ALLOCATION_PCT_PER_SYMBOL }}
          MIN_CASH_RESERVE_PCT: ${{ vars.MIN_CASH_RESERVE_PCT }}
          ALLOW_SHORT: ${{ vars.ALLOW_SHORT || 'false' }}
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ "${{ inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          python -m bot.run $ARGS

      - name: Commit dashboard data
        run: |
          git config user.name "ai-stockbroker[bot]"
          git config user.email "ai-stockbroker@users.noreply.github.com"
          git add -A docs/data/
          if git diff --staged --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore: update dashboard data [skip ci]"
            git push
          fi
